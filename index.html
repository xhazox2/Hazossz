<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hazar'ın Oyun Dünyası</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-top: 50px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        
        .game-container {
            display: flex;
            gap: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            width: 300px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #00ffcc;
        }

        .game-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .play-btn {
            display: inline-block;
            padding: 10px 25px;
            background: #00ffcc;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
        }

        .play-btn:hover { background: #00cca3; }
    </style>
</head>
<body>

    <h1>HAZAR'IN OYUN DÜNYASI</h1>
    <p>Beleş ve efsanevi oyunların tek adresi!</p>

    <div class="game-container">
        
        <!-- Oyun 1: Apollo -->
        <div class="game-card">
            <h3>Apollo: Pro Panel</h3>
            <p>Ay'a yumuşak iniş yapabilecek misin astronot?</p>
            <a href="oyun1/index.html" class="play-btn">HEMEN OYNA</a>
        </div>

        <!-- Oyun 2: Hazometry Dash -->
        <div class="game-card">
            <h3 style="color: #ff0055;">Hazometry Dash</h3>
            <p>Hız, refleks ve Hazar usulü zorluk!</p>
            <a href="oyun2/index.html" class="play-btn" style="background: #ff0055; color: white;">HEMEN OYNA</a>
        </div>

    </div>

</body>
</html>
