<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hazar'ın Oyun Dünyası</title>
    <style>
        /* Animasyonlu Arka Plan */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
        }

        /* Yıldız Efekti */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: transparent;
        }

        /* Başlık ve Kartlar */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            margin-bottom: 10px;
            color: #00ffcc;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 50px;
        }

        .card-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 300px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #ff0055;
            box-shadow: 0 15px 40px rgba(255, 0, 85, 0.3);
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #ff0055;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-apollo { background: #00ffcc; color: #000; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }

    </style>
</head>
<body>

    <!-- Hareketli Yıldızlar İçin Canvas -->
    <canvas id="stars" class="stars-container"></canvas>

    <div class="container">
        <h1>HAZAR'IN OYUN DÜNYASI</h1>
        <p class="subtitle">Beleş ve efsanevi oyunların tek adresi!</p>

        <div class="card-container">
            <!-- Apollo Kartı -->
            <div class="card">
                <h2 style="color: #00ffcc;">Apollo: Pro Panel</h2>
                <p>Ay'a yumuşak iniş yapabilecek misin astronot?</p>
                <a href="index.html" class="btn btn-apollo">HEMEN OYNA</a>
            </div>

            <!-- Hazometry Dash Kartı -->
            <div class="card">
                <h2 style="color: #ff0055;">Hazometry Dash</h2>
                <p>Hız, refleks ve Hazar usulü zorluk!</p>
                <a href="oyun2/index.html" class="btn">HEMEN OYNA</a>
            </div>
        </div>
    </div>

    <script>
        // Yıldız Yağmuru Efekti
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initStars);
        initStars();
        drawStars();
    </script>
</body>
</html>
