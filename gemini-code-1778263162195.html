<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazar'ın Oyun Dünyası</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: white;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s;
            border: 1px solid #333;
            text-align: center;
            padding-bottom: 15px;
        }
        .game-card:hover {
            transform: translateY(-10px);
            border-color: #ff416c;
        }
        .game-thumb {
            width: 100%;
            height: 150px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        .play-btn {
            background-color: #ff416c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        .play-btn:hover {
            background-color: #ff4b2b;
        }
    </style>
</head>
<body>

<header>
    <h1>Hazar Play</h1>
    <p>Ürettiğim en iyi HTML oyunlarını burada oyna!</p>
</header>

<div class="container">
    <div class="game-grid">
        
        <!-- Oyun 1 -->
        <div class="game-card">
            <div class="game-thumb">🚀</div>
            <h3>Uzay Simülasyonu</h3>
            <p>Ay'a yumuşak iniş yapabilecek misin?</p>
            <a href="oyun1/index.html" class="play-btn">Hemen Oyna</a>
        </div>

        <!-- Oyun 2 -->
        <div class="game-card">
            <div class="game-thumb">🎵</div>
            <h3>Ritim Ustası</h3>
            <p>Müziğin ritmine ayak uydur!</p>
            <a href="oyun2/index.html" class="play-btn">Hemen Oyna</a>
        </div>

        <!-- Oyun 3 -->
        <div class="game-card">
            <div class="game-thumb">🧊</div>
            <h3>Minecraft Parkur</h3>
            <p>Zorlu blokları aş ve sona ulaş.</p>
            <a href="oyun3/index.html" class="play-btn">Hemen Oyna</a>
        </div>

    </div>
</div>

</body>
</html>
