<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Apollo: Ay Görevi Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0f0; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0, 30, 0, 0.8); padding: 15px; border: 2px solid #0f0; border-radius: 5px; pointer-events: none; }
        #status { font-weight: bold; margin-top: 10px; }
        canvas { display: block; }
        .alert { color: #f00; text-transform: uppercase; }
        .success { color: #0ff; text-transform: uppercase; }
        #score-panel { position: absolute; top: 20px; right: 20px; color: gold; font-size: 1.2em; text-align: right; }
    </style>
</head>
<body>

<div id="ui">
    <h3>APOLLO PRO PANEL</h3>
    <p>Yakıt: <span id="fuel">100</span>%</p>
    <p>Hız: <span id="speed">0</span> m/s</p>
    <p>İrtifa: <span id="alt">0</span> km</p>
    <hr>
    <p>OK TUŞLARI: Hareket / Motor</p>
    <p>DİKKAT: <span class="alert">ASTEROİDLERE DİKKAT ET!</span></p>
    <p id="status">GÖREV: Ay'a güvenli in!</p>
    <p id="restart-msg" style="display:none;">(R Tuşuyla Yenile)</p>
</div>

<div id="score-panel">
    Skor: <span id="score">0</span><br>
    En Yüksek: <span id="highscore">0</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let gameActive = true;
let score = 0;
let highScore = localStorage.getItem('apolloHighScore') || 0;
document.getElementById('highscore').innerText = highScore;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Yıldızlar
const stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.5 });
}

// Asteroidler
const asteroids = [];
for (let i = 0; i < 5; i++) {
    createAsteroid();
}

function createAsteroid() {
    asteroids.push({
        x: Math.random() * (canvas.width - 200) + 100, // Dünya ve Ay arasından
        y: Math.random() * (canvas.height - 200) + 100,
        r: Math.random() * 15 + 10,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        damage: 10
    });
}

// Gemi Özellikleri
const ship = {
    x: 100, y: canvas.height / 2,
    vx: 0, vy: 0,
    angle: 0,
    fuel: 500, // 0-500 arası yakıt
    thrust: 0.12,
    width: 20, height: 30,
    explosionTimer: 0
};

const earth = { x: -250, y: canvas.height / 2, r: 350, gravity: 0.08 };
const moon = { x: canvas.width - 120, y: canvas.height / 2, r: 50, gravity: 0.03 };

const keys = {};
window.onkeydown = (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && !gameActive) {
        location.reload();
    }
};
window.onkeyup = (e) => keys[e.code] = false;

function loop() {
    if (!gameActive) return;

    // 1. Fizik Hesaplamaları
    // Dünya ve Ay Çekimi
    applyGravity(earth);
    applyGravity(moon);

    // Kontroller
    if (ship.fuel > 0) {
        if (keys['ArrowUp']) {
            ship.vx += Math.cos(ship.angle) * ship.thrust;
            ship.vy += Math.sin(ship.angle) * ship.thrust;
            ship.fuel -= 0.6;
        }
        if (keys['ArrowLeft']) ship.angle -= 0.04;
        if (keys['ArrowRight']) ship.angle += 0.04;
    }

    // Gemi Hareketi
    ship.x += ship.vx;
    ship.y += ship.vy;

    // Asteroid Hareketi
    asteroids.forEach(ast => {
        ast.x += ast.vx; ast.y += ast.vy;
        if (ast.x < 0) ast.x = canvas.width; else if (ast.x > canvas.width) ast.x = 0;
        if (ast.y < 0) ast.y = canvas.height; else if (ast.y > canvas.height) ast.y = 0;
    });

    // 2. Çizim
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Yıldızlar
    ctx.fillStyle = "white";
    stars.forEach(star => {
        ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();
        star.x += star.speed; // Yıldız kayması efekti
        if (star.x > canvas.width) star.x = 0;
    });

    // Dünya ve Ay
    drawPlanet(earth, "#1a4d8b"); // Dünya
    drawPlanet(moon, "#666");   // Ay (Daha koyu kraterli)

    // Asteroidler
    ctx.fillStyle = "#888";
    asteroids.forEach(ast => {
        ctx.beginPath(); ctx.arc(ast.x, ast.y, ast.r, 0, Math.PI * 2); ctx.fill();
    });

    // Roket
    drawShip();

    // 3. UI, Skor ve Durum
    updateUI();
    updateScore();

    requestAnimationFrame(loop);
}

// Yardımcı Fonksiyonlar
function applyGravity(planet) {
    let dx = planet.x - ship.x;
    let dy = planet.y - ship.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < planet.r + 300) {
        ship.vx += (dx / dist) * planet.gravity;
        ship.vy += (dy / dist) * planet.gravity;
    }
}

function drawPlanet(planet, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(planet.x, planet.y, planet.r, 0, Math.PI * 2); ctx.fill();
    if (planet === moon) { // Ay Kraterleri
        ctx.fillStyle = "#555";
        for (let i = 0; i < 5; i++) ctx.beginPath(); ctx.arc(planet.x + (Math.random()-0.5)*30, planet.y + (Math.random()-0.5)*30, 10 + Math.random()*5, 0, Math.PI * 2); ctx.fill();
    }
}

function drawShip() {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.fillStyle = "white";
    ctx.fillRect(-ship.height / 2, -ship.width / 2, ship.height, ship.width);
    ctx.fillStyle = "red"; // Burun
    ctx.beginPath(); ctx.moveTo(ship.height / 2, -ship.width / 2); ctx.lineTo(ship.height / 2 + 10, 0); ctx.lineTo(ship.height / 2, ship.width / 2); ctx.fill();

    if (keys['ArrowUp'] && ship.fuel > 0) { // Ateşleme görseli (gelişmiş duman)
        ctx.fillStyle = (ship.explosionTimer > 0) ? "orange" : "orange";
        for (let i = 0; i < 5; i++) ctx.beginPath(); ctx.arc(-20 - Math.random() * 10, (Math.random() - 0.5) * 10, 5 + Math.random() * 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function updateUI() {
    let dxM = moon.x - ship.x;
    let dyM = moon.y - ship.y;
    let distM = Math.sqrt(dxM * dxM + dyM * dyM);
    let speed = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);

    document.getElementById('fuel').innerText = Math.max(0, Math.floor(ship.fuel / 5));
    document.getElementById('speed').innerText = (speed * 100).toFixed(0);
    document.getElementById('alt').innerText = Math.max(0, Math.floor(distM - moon.r));

    // Çarpışma Kontrolü (Asteroid)
    asteroids.forEach(ast => {
        let dx = ast.x - ship.x;
        let dy = ast.y - ship.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < ast.r + 10) {
            endGame("PATLADIN!", "alert");
        }
    });

    // İniş Kontrolü (Ay)
    if (distM < moon.r + 10) {
        if (speed < 1.0) { // Daha yumuşak iniş
            endGame("BAŞARDIN! AY'A İNDİN!", "success");
            if (score > highScore) { localStorage.setItem('apolloHighScore', score); }
        } else {
            endGame("ÇAKILDIN! ÇOK HIZLIYDIN.", "alert");
        }
    }

    // Uzayda Kaybolma Kontrolü
    if (ship.x < -earth.r || ship.y < -canvas.height || ship.y > canvas.height * 2) {
        endGame("UZAYDA KAYBOLDUN...", "alert");
    }
}

function updateScore() {
    score++;
    document.getElementById('score').innerText = score;
}

function endGame(message, type) {
    gameActive = false;
    document.getElementById('status').innerText = message;
    document.getElementById('status').className = type;
    document.getElementById('restart-msg').style.display = 'block';
    if(type === 'alert') {
        explodeShip();
    }
}

function explodeShip() {
    for (let i = 0; i < 20; i++) { // Patlama efekti
        ctx.fillStyle = ["red", "orange", "yellow"][Math.floor(Math.random()*3)];
        ctx.beginPath(); ctx.arc(ship.x + (Math.random()-0.5)*50, ship.y + (Math.random()-0.5)*50, 5+Math.random()*10, 0, Math.PI * 2); ctx.fill();
    }
}

loop();
</script>
</body>
</html>
